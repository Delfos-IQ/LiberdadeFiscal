# Liberdade Fiscal — configuração do Cloudflare Worker de OCR (fallback foto+IA)
#
# NÃO DESPLOYADO AINDA. Passos para o autor desplegar quando quiser
# ativar a funcionalidade de foto+IA (ver worker/README.md para detalhe):
#
#   1. npm install -g wrangler   (ou npx wrangler)
#   2. wrangler login
#   3. wrangler secret put GROQ_API_KEY   (dentro da pasta worker/)
#   4. Ajustar ALLOWED_ORIGIN em ocr-fatura.js para o domínio real
#      (ex: https://delfos-iq.github.io) antes do deploy.
#   5. wrangler deploy
#   6. Copiar o URL do worker resultante para modules/faturas-foto.js
#      (módulo cliente ainda por construir, ver README principal).

name = "liberdade-fiscal-ocr"
main = "ocr-fatura.js"
compatibility_date = "2026-01-01"

# Sem KV, sem R2, sem D1, sem Durable Objects — o worker é stateless
# por design (privacidade, spec §9). Não adicionar bindings de
# armazenamento sem rever essa decisão explicitamente.

[vars]
OCR_MODEL = "llama-3.2-11b-vision-preview"

# Secrets (NÃO colocar aqui — usar `wrangler secret put`):
#   GROQ_API_KEY
